# Small FROM-SCRATCH experiment (CIFAR-100 / Tiny-ImageNet): shows the architecture helps on its own,
# independent of pretrained weights. Run every variant with equal epochs/compute:
#   python train_finetune.py --config config_scratch_cifar.yaml --dataset-dir datasets/cifar100
#   ... --n-passes 1 (untied 6)   --attention MHSA   --attention MHSA --n-passes 1
dataset_dir: null
train_dir: null
test_dir: null
class_subset: null
max_per_class: null
val_split: 0.1
test_split: 0.2
augment: basic
norm: half
num_workers: 4

image_size: 32
stem: patch
patch_size: 4                  # 8x8 = 64 tokens
dim: 256
num_heads: 8
mlp_ratio: 2.0
dropout: 0.1
attention: GIPA_FULL
coherence_reg: 0.0
qkv_bias: false
patch_norm: true
head_type: mlp
drop_path: 0.1

n_prelude: 0
n_core: 6
n_coda: 0
n_passes: 2
pass_embed: true
per_pass_gates: true
input_injection: false
aux_weight: 0.3

backbone: null
init_strategy: avg
layer_decay: 1.0

epochs: 100
batch_size: 128
grad_accum: 1
lr: 0.001
min_lr: 0.000001
weight_decay: 0.05
warmup_epochs: 5
label_smoothing: 0.1
grad_clip: 1.0
amp: true
seed: 42
device: auto
output_dir: runs_bench

mixup_alpha: 0.2
cutmix_alpha: 1.0
mixup_prob: 0.5
mixup_switch_prob: 0.5

monitor: val_acc
early_stop_patience: 20
early_stop_min_delta: 0.0

bootstrap: 1000
save_every: 1
resume: null
summary_only: false
