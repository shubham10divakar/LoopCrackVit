# SDNET2018 crack classification - FINE-TUNE a pretrained ViT-S into the looped CrackViT.
# Use with:  python train.py --config config_sdnet_finetune.yaml [overrides]
# Everything not listed here falls back to config.yaml's meaning; keys are identical.
# Compare against the from-scratch config.yaml runs and the controlled baselines (README).

data_root: "D:/D/my docs/my docs/ideas/attention based works/Ai in civil engineering/Concrete Crack Classification/code repo/Structural Defects Network (SDNET) 2018 archive"
split_mode: group
val_frac: 0.15
test_frac: 0.15
augment: true
num_workers: 4

# ---- backbone: must match DeiT-S / ViT-S (dim 384, 6 heads, mlp 4, patch 16) ----
image_size: 224
stem: patch
patch_size: 16
dim: 384
num_heads: 6
mlp_ratio: 4.0
dropout: 0.0
attention: GIPA_FULL
coherence_reg: 0.0
qkv_bias: true
patch_norm: false
head_type: linear
drop_path: 0.1

n_prelude: 0
n_core: 6
n_coda: 0
n_passes: 2
pass_embed: true
per_pass_gates: true
input_injection: false
aux_weight: 0.3

backbone: deit_small_patch16_224
init_strategy: avg
layer_decay: 0.75
norm: auto

epochs: 30
batch_size: 32
grad_accum: 1
lr: 0.0001
min_lr: 0.000001
weight_decay: 0.05
warmup_epochs: 2
scheduler: cosine
plateau_patience: 4
plateau_factor: 0.5
label_smoothing: 0.05
class_weights: true
grad_clip: 1.0
amp: true
seed: 42
device: auto
output_dir: runs_ft

monitor: val_auc
early_stop_patience: 8
early_stop_min_delta: 0.0005
restore_best: true

threshold_beta: 1.0
target_recall: 0.95
bootstrap: 1000
save_every: 0
resume: null
summary_only: false
debug_subset: 0
